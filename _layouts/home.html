<style>

/* ============================= */
/* FULLSCREEN VIDEO HERO */
/* ============================= */

.video-hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

/* video fills entire screen */
.video-bg {
  position: absolute;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  transform: translate(-50%, -50%);
  object-fit: cover;
  z-index: 0;
}

/* dark overlay for readability */
.video-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 1;
}

.video-overlay {
  position: absolute;
  /* responsive vertical position */
  top: clamp(80px, 12vh, 160px);
  /* shifts right and scales properly with screen size */
  left: clamp(40px, 8vw, 160px);
  /* prevents text from stretching too wide */
  width: min(90vw, 900px);
  z-index: 2;
}


.video-overlay .container {
  margin-left: 0;
}

.video-overlay h1,
.video-overlay .heading-title {
  color: white !important;
}

.video-overlay p,
.video-overlay .heading-description {
  color: white !important;
}


/* ============================= */
/* ALTERNATING CARD LAYOUT */
/* ============================= */

.cards-alt {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.cards-alt-row {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 40px;
}

.cards-alt-row .text-col {
  flex: 1 1 30%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  max-width: 480px;
}

.cards-alt-row .text-col h2 {
  margin: 0;
  font-size: 2rem;
}

.cards-alt-row .text-col p {
  margin: 0;
  font-size: 1.2rem;
}

.cards-alt-row .media-col {
  flex: 1 1 65%;
}

.cards-alt-row:nth-child(even) .text-col {
  order: 2;
}

.cards-alt-row:nth-child(even) .media-col {
  order: 1;
}

.media-col img,
.media-col video {
  width: 100%;
  height: auto;
  border-radius: 6px;
}

</style>
